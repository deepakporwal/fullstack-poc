name: Main CI

on:
  push:
  workflow_dispatch:

jobs:
  test-action:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Call My Custom Action
        uses: ./.github/actions/hello-action
        with:
          name: Deepak

  sonar-scan:
    uses: ./.github/workflows/sonar-scan.yml

  dotnet-build:
    uses: ./.github/workflows/dotnet-build.yml