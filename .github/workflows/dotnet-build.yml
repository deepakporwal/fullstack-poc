name: Build and Test .NET

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  dotnet-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore fullstack-poc.slnx

      - name: Build solution
        run: dotnet build fullstack-poc.slnx --configuration Release --no-restore

      - name: Test solution
        run: dotnet test fullstack-poc.slnx --configuration Release --no-build

      - name: Display build success
        run: |
          printf '\033[1;36m========================================\033[0m\n'
          printf '\033[1;32m          BUILD SUCCESSFUL\033[0m\n'
          printf '\033[1;36m========================================\033[0m\n'
          printf '\033[1;35m.NET 8 restore, build, and test completed.\033[0m\n'
          {
            echo '## Build successful'
            echo ''
            echo '- Restore: passed'
            echo '- Build: passed'
            echo '- Tests: passed'
          } >> "$GITHUB_STEP_SUMMARY"